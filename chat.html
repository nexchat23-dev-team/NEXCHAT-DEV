<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NEXCHAT - Stories & Messages</title>
  <link rel="stylesheet" href="chat.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="app">
    <!-- TOP HEADER BAR -->
    <header class="top-header">
      <div class="header-left">
        <h1 class="header-logo">NEXCHAT</h1>
      </div>
      <div class="header-right">
        <button id="search-btn-header" class="header-icon-btn" title="Search">🔍</button>
        <button id="settings-btn-header" class="header-icon-btn" title="Settings">⚙️</button>
        <a href="profile-upload.html" class="header-icon-btn" id="profileBtn" title="Profile">👤</a>
      </div>
    </header>

    <!-- REELS/CONTACTS CAROUSEL (horizontal scroll) -->
    <div class="stories-container">
      <div class="stories-scroll" id="storiesScroll">
        <a href="https://linuxprogrammer862-collab.github.io/NEXCHAT/" class="story-item" target="_blank" title="My Reel">
          <div class="story-avatar-wrapper">
            <div class="camera-icon">🎬</div>
          </div>
          <p class="story-label">My Reel</p>
        </a>
        <!-- Reels will be populated by JS -->
        <div id="storiesList" class="stories-list"></div>
      </div>
    </div>

    <!-- MAIN CHAT LIST -->
    <main class="chat-main">
      <!-- CHAT LIST VIEW -->
      <div id="chatListView" class="chat-list-view">
        <div class="chat-list-header">
          <h2>Messages</h2>
          <button id="newChatBtn" class="new-chat-btn" title="New chat">✏️</button>
        </div>

        <ul id="contactList" class="chat-list">
          <li class="empty-state">
            <p>No chats yet</p>
            <p class="hint">Search for friends to start chatting</p>
          </li>
        </ul>
      </div>

      <!-- CHAT DETAIL VIEW -->
      <div id="chatDetailView" class="chat-detail-view" style="display: none;">
        <!-- Chat Header -->
        <div class="chat-detail-header">
          <button id="backBtn" class="back-btn" title="Back to chats">‹</button>
          <div class="chat-header-profile">
            <img id="chatProfilePic" src="" alt="profile" class="header-avatar">
            <div class="header-text">
              <h3 id="chatName">User</h3>
              <p id="statusText" class="status-dot">🟢 Online</p>
            </div>
          </div>
          <button id="menuBtn" class="header-icon-btn" title="More">⋯</button>
        </div>

        <!-- Messages Area -->
        <div class="messages-area" id="messages-area">
          <div class="messages-list">
            <div class="empty-state">
              <p>No messages yet</p>
              <p class="hint">Start the conversation!</p>
            </div>
          </div>
          <div id="typingIndicator" class="typing-indicator" style="display: none;">
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
          </div>
        </div>

        <!-- Chat Options Menu -->
        <div id="chatOptionsMenu" class="options-popup" style="display: none;">
          <button id="callBtn" class="option-item">☎️ Call</button>
          <button id="videoCallBtn" class="option-item">📹 Video</button>
          <button id="muteBtn" class="option-item">🔇 Mute</button>
          <button id="blockBtn" class="option-item danger">🚫 Block</button>
          <button id="deleteBtn" class="option-item danger">🗑️ Delete</button>
        </div>

        <!-- Message Input -->
        <div class="message-input-area">
          <form id="message-form" class="message-form">
            <button type="button" id="attach-btn" class="input-btn">📎</button>
            <input 
              type="text" 
              id="message-input" 
              class="message-input" 
              placeholder="Say something..."
              autocomplete="off"
              maxlength="1000"
            />
            <button type="button" id="emoji-btn" class="input-btn">😊</button>
            <button type="submit" class="send-btn">✓</button>
          </form>

          <!-- Emoji Picker -->
          <div id="emoji-picker" class="emoji-picker-popup" style="display: none;">
            <div class="emoji-header">
              <span>Emojis</span>
              <button type="button" id="close-emoji-btn" class="close-btn">✕</button>
            </div>
            <div id="emoji-grid" class="emoji-grid"></div>
          </div>
        </div>
      </div>

      <!-- SEARCH OVERLAY -->
      <div id="search-overlay" class="search-overlay" style="display: none;">
        <div id="search-modal" class="search-modal">
          <div class="search-header">
            <input 
              type="text" 
              id="search-input" 
              class="search-input" 
              placeholder="Search by email, username, or name..." 
              autocomplete="off"
            />
            <button id="close-search-btn" class="close-btn">✕</button>
          </div>
          <div id="search-results" class="search-results"></div>
        </div>
      </div>

      <!-- INFO SIDEBAR (on chat detail) -->
      <div id="infoSidebar" class="info-panel" style="display: none;">
        <div class="info-header">
          <h3>Info</h3>
          <button id="closeInfoBtn" class="close-btn">✕</button>
        </div>

        <div class="info-body">
          <div class="user-card">
            <img id="infoPic" src="" alt="profile" class="user-avatar-large">
            <h3 id="infoName">User</h3>
            <p id="infoEmail">email@example.com</p>
            <p id="infoStatus">🟢 Online</p>
          </div>

          <div class="info-buttons">
            <button id="infoCallBtn" class="info-btn">☎️ Call</button>
            <button id="infoVideoBtn" class="info-btn">📹 Video</button>
            <button id="infoBlockBtn" class="info-btn danger">🚫 Block</button>
            <button id="infoDeleteBtn" class="info-btn danger">🗑️ Delete</button>
          </div>
        </div>
      </div>

      <!-- SETTINGS MODAL -->
      <div id="settingsModal" class="settings-modal" style="display: none;">
        <div class="settings-modal-content">
          <div class="settings-header">
            <h2>⚙️ Settings</h2>
            <button id="closeSettingsBtn" class="close-btn">✕</button>
          </div>
          <div class="settings-body">
            <div class="settings-section">
              <h3>Notifications</h3>
              <div class="setting-item">
                <label>
                  <input type="checkbox" id="notifToggle" checked>
                  Enable Notifications
                </label>
              </div>
              <div class="setting-item">
                <label>
                  <input type="checkbox" id="soundToggle" checked>
                  Sound Effects
                </label>
              </div>
            </div>

            <div class="settings-section">
              <h3>Privacy</h3>
              <div class="setting-item">
                <label>
                  <input type="checkbox" id="onlineStatusToggle" checked>
                  Show Online Status
                </label>
              </div>
              <div class="setting-item">
                <label>
                  <input type="checkbox" id="readReceiptsToggle" checked>
                  Read Receipts
                </label>
              </div>
            </div>

            <div class="settings-section">
              <h3>Theme</h3>
              <div class="setting-item">
                <label>
                  <input type="radio" name="theme" value="light" id="themeLight">
                  Light
                </label>
              </div>
              <div class="setting-item">
                <label>
                  <input type="radio" name="theme" value="dark" id="themeDark" checked>
                  Dark
                </label>
              </div>
            </div>

            <div class="settings-section">
              <h3>Account</h3>
              <button id="editProfileBtn" class="settings-action-btn">✏️ Edit Profile</button>
              <button id="changePasswordBtn" class="settings-action-btn">🔑 Change Password</button>
              <button id="clearCacheBtn" class="settings-action-btn">🗑️ Clear Cache</button>
            </div>

            <div class="settings-section">
              <button id="logoutSettingsBtn" class="settings-action-btn danger">🚪 Logout</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
      <button id="nav-messages" class="nav-item active" title="Messages">💬</button>
      <a href="profile-upload.html" id="nav-profile" class="nav-item" title="Profile">👤</a>
      <button id="logout-btn" class="nav-item logout" title="Logout">🚪</button>
    </nav>
  </div>

  <!-- NOTIFICATION CONTAINER -->
  <div id="notificationContainer" class="notification-container"></div>

  <script type="module" src="chat.js"></script>
</body>
</html>
